[project]
name = "betolink-blog"
description = "Reproducible environment for the betolink technical blog."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
ipykernel = ">=6.29,<7"
pyyaml = ">=6,<7"
nbformat = ">=5.10,<6"
nbclient = ">=0.10,<1"
numpy = ">=2.0,<3"
pandas = ">=2.2,<3"
xarray = ">=2024.6,<2027"
matplotlib = ">=3.9,<4"

# Interactive and geospatial stack requested for the default environment.
duckdb = ">=1.0,<3"
geoviews = ">=1.12,<2"
hvplot = ">=0.11,<1"
panel = ">=1.4,<2"
holoviews = ">=1.19,<2"
lonboard = ">=0.13,<1"
pydantic-ai = ">=0.4,<3"

# Runtime dependencies for the earthaccess plugin ecosystem.
harmony-py = ">=0.6"
pydap = ">=3.4"
netcdf4 = ">=1.7"
sliderule = ">=5.0"
h5py = ">=3.14"
h5netcdf = ">=1.3"
obstore = ">=0.12"
icechunk = ">=2.3"
virtualizarr = ">=2.8"
kerchunk = ">=0.2.9"
dask = ">=2025.1"
zarr = ">=3.1"
s3fs = ">=2025.2"
fsspec = ">=2025.2"
pyarrow = ">=14"
geopandas = ">=0.14"
shapely = ">=2.0"
odc-stac = ">=0.5"
rasterio = ">=1.3"

# earthaccess runtime dependencies (the fork and plugins are installed from
# pinned Git commits by scripts/install-git-packages.sh because their direct
# earthaccess-plugin-spec references use different branches).
python-cmr = ">=0.10"
tinynetrc = ">=1.3.1"
tenacity = ">=9.0"
multimethod = ">=1.8"
importlib-resources = ">=6.3.2"
pystac = ">=1.8"
tqdm = ">=4.66"
requests = ">=2.26"
typing-extensions = ">=4.10"
fastparquet = ">=2023.4"
numcodecs = ">=0.16"
distributed = ">=2025.1"
uv = ">=0.5"

# Image privacy and future GeoJupyter Story Map work.
exiftool = ">=12"
imagemagick = ">=7.1"
jupytergis = ">=0.16"
jupyter-tiler = ">=0.9"
openeo = ">=0.53"
stackstac = ">=0.5"
jupyterlab = ">=4.4"

[activation]
scripts = ["scripts/activate.sh"]

[tasks]
install-git-packages = "bash scripts/install-git-packages.sh"
render-notebooks = "bash scripts/render-notebooks.sh"
render-notebooks-full = "bash scripts/render-notebooks.sh --force"
ingest-images = "bash scripts/ingest-images.sh"
strip-image-metadata = "bash scripts/strip-image-metadata.sh"
build = "bash scripts/build.sh"
serve = "bash scripts/serve.sh"
lab = "jupyter lab"
check-links = "python3 scripts/check_links.py public"
clean = "bash scripts/clean.sh"
