{{ define "main" }}

<section class="search-page" aria-labelledby="search-title">
	<header class="blog-header">
		<h1 id="search-title" class="blog-title">
			/search<span class="cursor" aria-hidden="true">_</span>
		</h1>

		{{ with .Description }}
			<p class="blog-description">{{ . }}</p>
		{{ end }}
	</header>

	<div id="search" class="search-ui" data-pagefind-ignore></div>

	<p id="search-fallback" class="empty-state" hidden>
		The search index is not available in this build. It is generated by Pagefind after
		<code>hugo</code> runs. See <code>scripts/build.sh</code>.
	</p>

	<noscript>
		<p class="empty-state">Search requires JavaScript.</p>
	</noscript>
</section>

<script>
	window.addEventListener('DOMContentLoaded', function () {
		var container = document.getElementById('search');
		var fallback = document.getElementById('search-fallback');

		if (window.PagefindUI) {
			new window.PagefindUI({
				element: '#search',
				bundlePath: '{{ "pagefind/" | relURL }}',
				showSubResults: true,
				showImages: false,
				excerptLength: 28,
				translations: {
					placeholder: 'search articles, notebooks, projects...',
					zero_results: 'No results for [SEARCH_TERM]',
				},
			});
		} else if (fallback) {
			fallback.hidden = false;
		}
	});
</script>

{{ end }}
